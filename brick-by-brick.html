<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Brick by Brick — Yunus &amp; Şevval</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;display:grid;place-items:center;padding:14px;
    background:radial-gradient(140% 100% at 50% -10%, #ffe6ef 0%, #f4d6e6 45%, #e2c1da 100%);
    font-family:ui-rounded,"Avenir Next Rounded","Trebuchet MS",system-ui,sans-serif;
    color:#2b1f1a;user-select:none;-webkit-user-select:none;overflow:hidden;
  }
  .wrap{width:min(920px,96vw);display:flex;flex-direction:column;gap:10px}
  .top{display:flex;align-items:baseline;justify-content:space-between;padding:0 6px}
  .top h1{margin:0;font-size:18px;letter-spacing:2.5px;text-transform:uppercase;font-weight:800}
  .top .n{font-size:11px;letter-spacing:1.4px;opacity:.55}
  canvas{
    width:100%;display:block;background:#fff4e8;
    border:5px solid #2b1f1a;border-radius:20px;
    box-shadow:0 12px 0 rgba(43,31,26,.16),0 24px 44px rgba(59,35,64,.25);
    touch-action:none;cursor:default;
  }
  .foot{display:flex;justify-content:space-between;gap:10px;padding:0 6px;font-size:11px;letter-spacing:.6px;opacity:.55}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Brick by Brick</h1>
    <div class="n">51 tuğla · 51 bulmaca · Yunus &amp; Şevval</div>
  </div>
  <canvas id="cv" width="900" height="560"></canvas>
  <div class="foot"><span>Sudoku: 1–9 yaz · N not · H ipucu</span><span>Blok: sürükle-bırak · Z geri al</span></div>
</div>

<script>
(function(){
"use strict";
/* =====================================================================
   01 · CORE — canvas, helpers, input, audio, save, characters
   ===================================================================== */
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var W = 900, H = 560, DPR = 1;
try { DPR = Math.min(2, Math.max(1, window.devicePixelRatio || 1)); } catch (e) {}
cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);

var INK = '#2b1f1a', SKIN = '#f2c8a6', HAIR = '#1e1712', SHIRT = '#6d4a3c', PINK = '#ff5c8a', CREAM = '#fff4e8';
var FONT = 'ui-rounded,"Avenir Next Rounded","Trebuchet MS",system-ui,sans-serif';
var LEGO = ['#E0475F', '#3F7FD0', '#F2B632', '#4FB06A', '#F58A3A', '#8E6BC8', '#2FB5B5'];

/* ---------- small helpers ---------- */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rnd(a, b) { return a + Math.random() * (b - a); }
function rndi(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function easeOutCubic(t) { t = clamp(t, 0, 1); return 1 - Math.pow(1 - t, 3); }
function easeOutBack(t) { t = clamp(t, 0, 1); var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
function inR(px, py, x, y, w, h) { return px >= x && px <= x + w && py >= y && py <= y + h; }

var _sh = {};
function shade(hex, f) {
  var key = hex + '|' + f;
  if (_sh[key]) return _sh[key];
  var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (f >= 0) { r = Math.round(r + (255 - r) * f); g = Math.round(g + (255 - g) * f); b = Math.round(b + (255 - b) * f); }
  else { r = Math.round(r * (1 + f)); g = Math.round(g * (1 + f)); b = Math.round(b * (1 + f)); }
  return (_sh[key] = '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1));
}

/* ---------- drawing helpers ---------- */
function ink(w) { ctx.lineWidth = w || 3; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; }
function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function fs(x, y, w, h, r, fill, lw) { rr(x, y, w, h, r === undefined ? 6 : r); ctx.fillStyle = fill; ctx.fill(); ink(lw || 3); ctx.stroke(); }
function circle(x, y, r, fill, lw) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (lw !== 0) { ink(lw || 3); ctx.stroke(); }
}
function txt(s, x, y, size, col, align, weight) {
  ctx.fillStyle = col || INK;
  ctx.font = (weight || '800') + ' ' + (size || 18) + 'px ' + FONT;
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
}
function txtO(s, x, y, size, fill, stroke, lw, align) {
  ctx.font = '900 ' + size + 'px ' + FONT; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = lw || 6; ctx.strokeStyle = stroke || INK; ctx.strokeText(s, x, y);
  ctx.fillStyle = fill || '#fff'; ctx.fillText(s, x, y);
}
function txtW(s, size, weight) { ctx.font = (weight || '800') + ' ' + size + 'px ' + FONT; return ctx.measureText(s).width; }
function wrapLines(s, maxW, size, weight) {
  ctx.font = (weight || '700') + ' ' + size + 'px ' + FONT;
  var words = String(s).split(' '), lines = [], cur = '';
  for (var i = 0; i < words.length; i++) {
    var t = cur ? cur + ' ' + words[i] : words[i];
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = words[i]; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
function para(s, x, y, maxW, size, col, lh, align, weight) {
  var lines = wrapLines(s, maxW, size, weight || '700');
  for (var i = 0; i < lines.length; i++) txt(lines[i], x, y + i * lh, size, col, align || 'center', weight || '700');
  return lines.length;
}
function drawHeartAt(x, y, r, col) {
  ctx.save(); ctx.translate(x, y); ctx.scale(r / 10, r / 10);
  ctx.beginPath();
  ctx.moveTo(0, 7); ctx.bezierCurveTo(-12, -2, -8, -12, 0, -6); ctx.bezierCurveTo(8, -12, 12, -2, 0, 7);
  ctx.closePath(); ctx.fillStyle = col || PINK; ctx.fill(); ink(2.4); ctx.stroke();
  ctx.restore();
}
function drawStar(x, y, r, col) {
  ctx.beginPath();
  for (var i = 0; i < 10; i++) {
    var a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath(); ctx.fillStyle = col || '#ffd166'; ctx.fill(); ink(2); ctx.stroke();
}

/* ---------- particles ---------- */
var parts = [];
function burst(x, y, n, cols, o) {
  o = o || {};
  for (var i = 0; i < n; i++) {
    var a = rnd(0, Math.PI * 2), sp = rnd(o.minSp || 60, o.maxSp || 220);
    parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 40), g: o.g === undefined ? 520 : o.g,
      life: rnd(o.minLife || 0.5, o.maxLife || 0.95), t: 0, size: rnd(o.minSize || 3, o.maxSize || 7), col: pick(cols), kind: o.kind || 'sq', rot: rnd(0, 6), vr: rnd(-8, 8) });
  }
}
function floatHearts(x, y, n) {
  for (var i = 0; i < n; i++)
    parts.push({ x: x + rnd(-24, 24), y: y + rnd(-6, 6), vx: rnd(-18, 18), vy: rnd(-70, -40), g: -6, life: rnd(1.0, 1.7), t: -i * 0.09, size: rnd(7, 12), col: pick([PINK, '#ff8fb0', '#ff5c8a', '#ffb3c8']), kind: 'heart', rot: 0, vr: 0 });
}
function updateParts(dt) {
  for (var i = parts.length - 1; i >= 0; i--) {
    var p = parts[i]; p.t += dt;
    if (p.t < 0) continue;
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.t > p.life) parts.splice(i, 1);
  }
}
function drawParts() {
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i]; if (p.t < 0) continue;
    var a = clamp(1 - p.t / p.life, 0, 1);
    ctx.globalAlpha = Math.min(1, a * 1.6);
    if (p.kind === 'heart') drawHeartAt(p.x, p.y, p.size, p.col);
    else if (p.kind === 'star') drawStar(p.x, p.y, p.size, p.col);
    else { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.col; ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size); ctx.restore(); }
    ctx.globalAlpha = 1;
  }
}

/* ---------- audio (tiny WebAudio blips) ---------- */
var AC = null, master = null, muted = false;
function audioInit() {
  if (AC) { try { if (AC.state === 'suspended') AC.resume(); } catch (e) {} return; }
  try {
    var A = window.AudioContext || window.webkitAudioContext;
    if (!A) return;
    AC = new A(); master = AC.createGain(); master.gain.value = 0.14; master.connect(AC.destination);
  } catch (e) { AC = null; }
}
function tone(f, d, type, vol, delay, slide) {
  if (!AC || muted) return;
  try {
    var t0 = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t0 + d);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol || 0.5, t0 + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + d + 0.03);
  } catch (e) {}
}
function noise(d, vol, delay, hp) {
  if (!AC || muted) return;
  try {
    var t0 = AC.currentTime + (delay || 0), len = Math.max(1, Math.floor(AC.sampleRate * d)), buf = AC.createBuffer(1, len, AC.sampleRate), data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = hp || 1200; s.buffer = buf;
    g.gain.setValueAtTime(vol || 0.4, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    s.connect(f); f.connect(g); g.connect(master); s.start(t0);
  } catch (e) {}
}
function sfx(n) {
  if (!AC || muted) return;
  switch (n) {
    case 'click': tone(620, 0.05, 'triangle', 0.35); break;
    case 'num': tone(540, 0.06, 'sine', 0.35); break;
    case 'erase': tone(300, 0.06, 'sine', 0.3); break;
    case 'bad': tone(190, 0.16, 'sawtooth', 0.22, 0, 120); break;
    case 'good': tone(660, 0.09, 'triangle', 0.4); tone(990, 0.14, 'triangle', 0.4, 0.08); break;
    case 'word': tone(523, 0.1, 'triangle', 0.4); tone(659, 0.1, 'triangle', 0.4, 0.09); tone(784, 0.18, 'triangle', 0.4, 0.18); break;
    case 'drop': tone(380, 0.07, 'square', 0.18); break;
    case 'pop': tone(820, 0.07, 'sine', 0.3, 0, 500); break;
    case 'clear': tone(523, 0.09, 'triangle', 0.4); tone(659, 0.09, 'triangle', 0.4, 0.07); tone(784, 0.09, 'triangle', 0.4, 0.14); tone(1046, 0.16, 'triangle', 0.4, 0.21); break;
    case 'snap': noise(0.05, 0.5, 0, 900); tone(210, 0.09, 'square', 0.3, 0, 120); tone(840, 0.05, 'triangle', 0.25, 0.03); break;
    case 'win': [523, 659, 784, 1046, 1318].forEach(function (f, i) { tone(f, 0.18, 'triangle', 0.42, i * 0.1); }); break;
    case 'meow': tone(620, 0.25, 'sawtooth', 0.14, 0, 380); tone(540, 0.25, 'triangle', 0.2, 0.0, 330); break;
  }
}

/* ---------- save ---------- */
var SAVE_KEY = 'brickbybrick.v1';
var save = { level: 0, seen: {}, muted: false, sec: 0, skips: 0, intro: false };
function loadSave() {
  try {
    var s = window.localStorage && window.localStorage.getItem(SAVE_KEY);
    if (s) { var o = JSON.parse(s); if (o && typeof o.level === 'number') { save.level = o.level; save.seen = o.seen || {}; save.muted = !!o.muted; save.sec = o.sec || 0; save.skips = o.skips || 0; save.intro = !!o.intro; } }
  } catch (e) {}
  muted = save.muted;
}
function writeSave() { try { window.localStorage && window.localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ---------- input ---------- */
var keys = {};
var ptr = { x: -99, y: -99, down: false, clickAt: null, dx: 0, dy: 0, moved: 0 };
function evPos(e) {
  var r = cv.getBoundingClientRect(), w = r.width || W, h = r.height || H;
  return { x: (e.clientX - r.left) * W / w, y: (e.clientY - r.top) * H / h };
}
cv.addEventListener('pointerdown', function (e) {
  audioInit();
  var p = evPos(e); ptr.x = p.x; ptr.y = p.y; ptr.down = true; ptr.dx = p.x; ptr.dy = p.y; ptr.moved = 0;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (e.preventDefault) e.preventDefault();
  onPointerDown(p.x, p.y);
});
window.addEventListener('pointermove', function (e) {
  var p = evPos(e); ptr.x = p.x; ptr.y = p.y;
  if (ptr.down) ptr.moved = Math.max(ptr.moved, Math.hypot(p.x - ptr.dx, p.y - ptr.dy));
  onPointerMove(p.x, p.y);
});
function pointerUp(e) {
  var p = evPos(e); ptr.x = p.x; ptr.y = p.y;
  var was = ptr.down; ptr.down = false;
  if (was) { if (ptr.moved < 12) ptr.clickAt = { x: p.x, y: p.y }; onPointerUp(p.x, p.y); }
}
window.addEventListener('pointerup', pointerUp);
window.addEventListener('pointercancel', pointerUp);
window.addEventListener('keydown', function (e) {
  audioInit();
  var code = e.code || '', key = e.key || '';
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Backspace'].indexOf(code) >= 0 && e.preventDefault) e.preventDefault();
  keys[code] = true;
  onKey(code, key);
});
window.addEventListener('keyup', function (e) { keys[e.code || ''] = false; });

/* ---------- immediate-mode button ---------- */
var uiLock = false;
function btn(x, y, w, h, label, o) {
  o = o || {};
  var dis = !!o.disabled, locked = uiLock;
  var over = !dis && !locked && inR(ptr.x, ptr.y, x, y, w, h);
  var down = over && ptr.down;
  var depth = o.flat ? 0 : 4, rad = o.r === undefined ? 12 : o.r;
  var fill = dis ? '#e4d9cc' : (o.fill || '#fff');
  var yy = y + (down ? depth : 0);
  if (!down && depth) { rr(x, y + depth, w, h, rad); ctx.fillStyle = INK; ctx.fill(); }
  rr(x, yy, w, h, rad); ctx.fillStyle = over && !down ? shade(fill, 0.22) : fill; ctx.fill();
  ink(o.lw || 3); ctx.stroke();
  if (label) txt(label, x + w / 2, yy + h / 2 + 1, o.size || 15, dis ? 'rgba(43,31,26,.38)' : (o.color || INK), 'center', '800');
  if (o.draw) o.draw(x + w / 2, yy + h / 2, w, h, over);
  var clicked = false;
  if (!dis && !locked && ptr.clickAt && inR(ptr.clickAt.x, ptr.clickAt.y, x, y, w, h)) { clicked = true; ptr.clickAt = null; sfx('click'); }
  return clicked;
}

/* ---------- characters (same look as the earlier games) ---------- */
function drawYunus(x, y, s, o) {
  o = o || {};
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  var d = o.duck ? 0.5 : 1, bh = 26 * d;
  ink(4); ctx.beginPath();
  var sw = o.walk ? Math.sin(o.walk) * 5 : 0;
  ctx.moveTo(-6, -bh); ctx.lineTo(-6 + sw, 0); ctx.moveTo(6, -bh); ctx.lineTo(6 - sw, 0); ctx.stroke();
  if (o.cheer) {
    var a = Math.sin((o.t || 0) * 12) * 3;
    ctx.strokeStyle = SHIRT; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath();
    ctx.moveTo(-12, -bh); ctx.lineTo(-24, -bh - 16 + a); ctx.moveTo(12, -bh); ctx.lineTo(24, -bh - 16 - a); ctx.stroke();
    circle(-24, -bh - 16 + a, 4.5, SKIN, 2.4); circle(24, -bh - 16 - a, 4.5, SKIN, 2.4);
  }
  fs(-12, -bh - 4, 24, bh + 6, 7, SHIRT);
  var hy = -bh - 4 - 17;
  circle(0, hy, 17, SKIN);
  ctx.beginPath(); ctx.arc(0, hy, 17, Math.PI * 1.02, Math.PI * 2.02); ctx.closePath();
  ctx.fillStyle = HAIR; ctx.fill(); ink(3); ctx.stroke();
  ink(3.4); ctx.beginPath();
  ctx.moveTo(-11, hy - 3); ctx.lineTo(-3, hy - 5); ctx.moveTo(3, hy - 5); ctx.lineTo(11, hy - 3); ctx.stroke();
  if (o.happy) {
    ink(2.6); ctx.beginPath(); ctx.moveTo(-11, hy + 5); ctx.quadraticCurveTo(-7, hy - 1, -3, hy + 5);
    ctx.moveTo(3, hy + 5); ctx.quadraticCurveTo(7, hy - 1, 11, hy + 5); ctx.stroke();
  } else if (o.worried) {
    circle(-7, hy + 5, 2.6, INK, 0); circle(7, hy + 5, 2.6, INK, 0);
  } else { circle(-7, hy + 4, 2.6, INK, 0); circle(7, hy + 4, 2.6, INK, 0); }
  ink(2.4); ctx.beginPath();
  if (o.happy) ctx.arc(0, hy + 7, 6, 0.15 * Math.PI, 0.85 * Math.PI);
  else if (o.worried) ctx.arc(0, hy + 13, 5, 1.15 * Math.PI, 1.85 * Math.PI);
  else { ctx.moveTo(-5, hy + 11); ctx.lineTo(5, hy + 11); }
  ctx.stroke();
  ctx.restore();
}
function drawSevval(x, y, s, o) {
  o = o || {};
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ink(4); ctx.beginPath(); ctx.moveTo(-5, -22); ctx.lineTo(-5, 0); ctx.moveTo(5, -22); ctx.lineTo(5, 0); ctx.stroke();
  if (o.cheer) {
    var a = Math.sin((o.t || 0) * 12 + 1) * 3;
    ctx.strokeStyle = SKIN; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath();
    ctx.moveTo(-8, -28); ctx.lineTo(-22, -42 + a); ctx.moveTo(8, -28); ctx.lineTo(22, -42 - a); ctx.stroke();
    circle(-22, -42 + a, 4, SKIN, 2.4); circle(22, -42 - a, 4, SKIN, 2.4);
  }
  ctx.beginPath(); ctx.moveTo(-9, -30); ctx.lineTo(9, -30); ctx.lineTo(15, -2); ctx.lineTo(-15, -2); ctx.closePath();
  ctx.fillStyle = '#ff8fb0'; ctx.fill(); ink(3); ctx.stroke();
  var hy = -30 - 17;
  circle(0, hy, 17, SKIN);
  ctx.beginPath(); ctx.arc(0, hy, 18, Math.PI * 0.97, Math.PI * 2.03); ctx.closePath();
  ctx.fillStyle = '#2f2119'; ctx.fill(); ink(3); ctx.stroke();
  circle(-16, hy + 3, 7, '#2f2119'); circle(16, hy + 3, 7, '#2f2119');
  if (o.tired) {
    ink(2.4); ctx.beginPath(); ctx.moveTo(-11, hy + 4); ctx.lineTo(-2, hy + 4); ctx.moveTo(2, hy + 4); ctx.lineTo(11, hy + 4); ctx.stroke();
  } else if (o.happy) {
    ink(2.6); ctx.beginPath(); ctx.moveTo(-11, hy + 3); ctx.quadraticCurveTo(-6, hy - 2, -1, hy + 3);
    ctx.moveTo(3, hy + 3); ctx.quadraticCurveTo(9, hy - 2, 14, hy + 3); ctx.stroke();
  } else {
    circle(-7, hy + 3, 5.2, '#fff'); circle(7, hy + 3, 5.2, '#fff');
    circle(-6.5, hy + 4, 3, '#3a2418', 0); circle(7.5, hy + 4, 3, '#3a2418', 0);
    circle(-5.4, hy + 2.6, 1.2, '#fff', 0); circle(8.6, hy + 2.6, 1.2, '#fff', 0);
  }
  ctx.globalAlpha = 0.65; circle(-11, hy + 10, 3.6, '#ff9ab5', 0); circle(11, hy + 10, 3.6, '#ff9ab5', 0); ctx.globalAlpha = 1;
  ink(2); ctx.beginPath(); ctx.moveTo(0, hy + 8); ctx.lineTo(1.5, hy + 9.5); ctx.stroke();
  ink(2.4); ctx.beginPath(); ctx.arc(0, hy + (o.happy ? 9 : 10), 4.5, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  ctx.restore();
}

/* =====================================================================
   02 · CAT — the lego cat model, bricks, baseplate, drop animation
   ===================================================================== */
var CAT_W = 16, CAT_H = 15;
var CAT_COL = { O: '#F5A03C', D: '#D9792A', C: '#FFE8C4', P: '#FF8FA8', K: '#2F2420', W: '#FFFFFF', R: '#E0475F', Y: '#FFD166' };
var PLATE_COL = '#5DB86C';
/* [x, y, w, h, color] — in build order (feet first, sparkles last) */
var BRICKS = [

}
function puzzleDraw() {
  bgPattern();
  var T = pz.T, locked = !!ov || pz.solvedT >= 0 || fade.dir !== 0;
  uiLock = locked;
  T.draw();
  uiLock = !!ov || fade.dir !== 0 || pz.solvedT >= 0;
  headerBar();
  if (btn(12, 10, 112, 40, '« Kedi', { size: 14 })) go('build');
  txt('Bölüm ' + (pz.lvl + 1) + ' / ' + TOTAL, 450, 22, 17, INK, 'center', '900');
  txt(T.name + ' · ' + T.label(pz.tier), 450, 43, 12.5, 'rgba(43,31,26,.6)', 'center', '800');
  soundBtn(W - 60, 10);
  if (btn(W - 60 - 6 - 84, 10, 84, 40, 'Atla', { size: 14 })) ov = { kind: 'skip', t: 0 };
  if (btn(W - 60 - 6 - 84 - 6 - 42, 10, 42, 40, '?', { size: 18 })) openRules(false);
  uiLock = false;
}

/* ---------- overlays ---------- */
function ovBegin(w, h) {
  var u = 0.9 + 0.1 * easeOutBack(clamp(ov.t / 0.26, 0, 1)), a = clamp(ov.t / 0.14, 0, 1);
  ctx.fillStyle = 'rgba(43,31,26,' + (0.5 * a) + ')'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, H / 2); ctx.scale(u, u); ctx.translate(-W / 2, -H / 2);
  panel((W - w) / 2, (H - h) / 2, w, h, '#fffaf2', 20);
  return { x: (W - w) / 2, y: (H - h) / 2, w: w, h: h };
}
function ovEnd() { ctx.restore(); }
function closeRules() { if (ov && ov.first) { save.seen[ov.type] = true; writeSave(); } ov = null; }
function newGame() {
  save.level = 0; save.seen = {}; save.sec = 0; save.skips = 0; save.intro = false; writeSave();
  ov = null; go('intro');
}
function overlayDraw() {
  var k = ov.kind, c, i;
  if (k === 'rules') {
    c = ovBegin(600, 372);
    drawTypeIcon(ov.type, c.x + 62, c.y + 64, 58);
    txt(ov.title, c.x + 118, c.y + 56, 25, INK, 'left', '900');
    var y = c.y + 108;
    for (i = 0; i < ov.lines.length; i++) {
      circle(c.x + 44, y + 12, 15, LEGO[i], 3); txt(String(i + 1), c.x + 44, y + 13, 15, '#fff', 'center', '900');
      var ls = wrapLines(ov.lines[i], c.w - 120, 16, '800');
      for (var j = 0; j < ls.length; j++) txt(ls[j], c.x + 74, y + 12 + j * 21 - (ls.length - 1) * 10, 16, INK, 'left', '800');
      y += Math.max(58, ls.length * 21 + 16);
    }
    if (btn(c.x + c.w / 2 - 110, c.y + c.h - 72, 220, 52, 'Anladım!', { size: 19, fill: '#ffd95e' })) closeRules();
    ovEnd();
  } else if (k === 'clear') {
    drawYunus(130, 470, 2.3, { happy: true, cheer: true, t: ov.t });
    drawSevval(770, 470, 2.3, { happy: true, cheer: true, t: ov.t });
    c = ovBegin(440, 340);
    txtO('Bölüm tamam!', c.x + c.w / 2, c.y + 52, 38, '#fff', INK, 9);
    txt('Yeni bir tuğla kazandın', c.x + c.w / 2, c.y + 98, 17, INK, 'center', '800');
    var bob = Math.sin(ov.t * 4) * 5;
    brickPreview(pz.lvl, c.x + c.w / 2, c.y + 160 + bob, 150, 76, 76);
    txt('Parça ' + (pz.lvl + 1) + ' / ' + TOTAL, c.x + c.w / 2, c.y + 224, 15, 'rgba(43,31,26,.6)', 'center', '900');
    if (btn(c.x + c.w / 2 - 130, c.y + c.h - 76, 260, 54, 'Parçayı yerleştir »', { size: 19, fill: '#ffd95e' })) finishLevel();
    ovEnd();
  } else if (k === 'skip') {
    c = ovBegin(470, 236);
    txt('Bu bölümü atlayalım mı?', c.x + c.w / 2, c.y + 50, 25, INK, 'center', '900');
    para('Atlarsan tuğla yine de yerine oturur. Ama bulmaca çözmek daha eğlenceli!', c.x + c.w / 2, c.y + 100, c.w - 60, 16, INK, 22, 'center', '800');
    if (btn(c.x + 28, c.y + c.h - 72, 190, 50, 'Vazgeç', { size: 17, fill: '#e3f4ff' })) ov = null;
    if (btn(c.x + c.w - 218, c.y + c.h - 72, 190, 50, 'Atla »', { size: 17 })) { save.skips++; finishLevel(); }
    ovEnd();
  } else if (k === 'newgame') {
    c = ovBegin(480, 236);
    txt('Yeni oyun başlasın mı?', c.x + c.w / 2, c.y + 50, 25, INK, 'center', '900');
    para('Şu anki ilerleme silinir ve kedi baştan, boş plakadan başlar.', c.x + c.w / 2, c.y + 100, c.w - 60, 16, INK, 22, 'center', '800');
    if (btn(c.x + 28, c.y + c.h - 72, 200, 50, 'Vazgeç', { size: 17, fill: '#e3f4ff' })) ov = null;
    if (btn(c.x + c.w - 228, c.y + c.h - 72, 200, 50, 'Evet, baştan', { size: 17 })) newGame();
    ovEnd();
  } else if (k === 'message') {
    c = ovBegin(560, 440);
    for (i = 0; i < END_LINES.length; i++) {
      var last = i === END_LINES.length - 1;
      txt(END_LINES[i], c.x + c.w / 2, c.y + 52 + i * 34 + (last ? 12 : 0), i === 0 ? 30 : (last ? 24 : 20), last ? '#d6336c' : INK, 'center', last || i === 0 ? '900' : '800');
    }
    drawHeartAt(c.x + c.w / 2, c.y + 52 + (END_LINES.length - 1) * 34 + 12 + 36, 15 + Math.sin(ov.t * 5) * 1.5);
    txt('Toplam süre: ' + fmtTime(save.sec), c.x + c.w / 2, c.y + c.h - 86, 13, 'rgba(43,31,26,.5)', 'center', '800');
    if (btn(c.x + c.w / 2 - 80, c.y + c.h - 66, 160, 46, 'Kapat', { size: 17, fill: '#ffd95e' })) ov = null;
    ovEnd();
  }
}
function ovPrimary() {
  if (!ov || ov.t < 0.3) return;
  if (ov.kind === 'rules') closeRules();
  else if (ov.kind === 'clear') finishLevel();
  else if (ov.kind === 'message') ov = null;
}

/* ---------- input routing (called by the listeners in the core) ---------- */
function onPointerDown(x, y) { if (fade.dir || ov) return; if (scene === 'puzzle' && pz && pz.solvedT < 0) pz.T.down(x, y); }
function onPointerMove(x, y) { if (fade.dir || ov) return; if (scene === 'puzzle' && pz && pz.solvedT < 0) pz.T.move(x, y); }
function onPointerUp(x, y) { if (fade.dir) return; if (scene === 'puzzle' && pz && pz.solvedT < 0 && !ov) pz.T.up(x, y); }
function onKey(code, key) {
  if (fade.dir) return;
  if (ov) { if (code === 'Enter' || code === 'Space') ovPrimary(); else if (code === 'Escape' && ov.kind !== 'clear') { if (ov.kind === 'rules') closeRules(); else ov = null; } return; }
  var enter_ = code === 'Enter' || code === 'Space';
  if (scene === 'puzzle') { if (pz.solvedT < 0 && pz.T.key(code, key)) return; }
  else if (scene === 'title' && enter_) startFromTitle();
  else if (scene === 'build' && enter_ && !dropA && save.level < TOTAL && !bld.finishing) startPuzzle(save.level);
  else if (scene === 'final' && enter_) finMeow();
  else if (scene === 'intro' && enter_ && intro.t > 4.3) { save.intro = true; writeSave(); go('build'); }
}

/* ---------- frame ---------- */
function update(dt) {
  sceneT += dt;
  if (ov) ov.t += dt;
  if (scene === 'title') titleStep(dt);
  else if (scene === 'intro') introStep(dt);
  else if (scene === 'build') buildStep(dt);
  else if (scene === 'puzzle') puzzleStep(dt);
  else if (scene === 'final') finStep(dt);
  updateParts(dt);
  if (fade.dir === 1) { fade.a += dt * 4.6; if (fade.a >= 1) { fade.a = 1; enter(fade.next, fade.opts); fade.dir = -1; } }
  else if (fade.dir === -1) { fade.a -= dt * 3.8; if (fade.a <= 0) { fade.a = 0; fade.dir = 0; } }
}
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  uiLock = fade.dir !== 0 || !!ov;
  if (scene === 'title') titleDraw();
  else if (scene === 'intro') introDraw();
  else if (scene === 'build') buildDraw();
  else if (scene === 'puzzle') puzzleDraw();
  else if (scene === 'final') finDraw();
  drawParts();
  uiLock = fade.dir !== 0;
  if (ov) overlayDraw();
  uiLock = false;
  if (fade.a > 0) { ctx.fillStyle = 'rgba(255,244,232,' + fade.a + ')'; ctx.fillRect(0, 0, W, H); }
}
function stepFrame(dt) { update(dt); render(); ptr.clickAt = null; }
var lastTs = 0;
function loop(ts) {
  var dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016;
  lastTs = ts;
  try { stepFrame(dt); } catch (e) { if (window.console) console.error(e); }
  requestAnimationFrame(loop);
}
loadSave();
save.level = clamp(save.level, 0, TOTAL);
enter('title');
window.addEventListener('beforeunload', function () { writeSave(); });
requestAnimationFrame(loop);

})();
</script>
